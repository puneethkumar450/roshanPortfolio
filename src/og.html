<!doctype html>
<!-- Template for the share image, assets/og-image.jpg (1200 x 630). tools/build_site.py fills it from
     content.json and src/themes.json and writes tools/og-render.html; screenshot that file at
     1200 x 630 and convert it to JPEG (see README.md, "Share image"). Not deployed as a page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roshan Bharti — share image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&amp;display=swap">
<style>
  @font-face {
    font-family: "Bricolage";
    src: url("../assets/fonts/BricolageGrotesque-var.woff2") format("woff2");
    font-weight: 200 800; font-stretch: 75% 100%;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #E9DFCA; color: #262626; font-family: "Bricolage", sans-serif;
    padding: 46px 52px 48px; display: grid; grid-template-rows: auto auto auto 1fr; -webkit-font-smoothing: antialiased;
  }
  .top { display: flex; justify-content: space-between; align-items: center; font: 400 17px/1 "DM Mono", monospace; color: #5A5346; }
  .top b { display: inline-flex; align-items: center; gap: 12px; font-weight: 400; color: #262626; }
  .top b::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #0077FF; }
  .wm {
    margin-top: 30px; display: flex; align-items: center; white-space: nowrap;
    font-size: calc(1096px / {{wm_k}}); font-weight: 800; font-stretch: 78%; letter-spacing: -.012em; line-height: .8;
  }
  .wm span:first-child { margin-left: -.04em; }
  .wm img { width: .78em; height: auto; margin-inline: .03em .045em; transform: translateY(-.025em); }
  .tag { margin-top: 26px; font-size: 40px; line-height: 1.05; letter-spacing: -.02em; font-weight: 500; }
  .tag em { font-style: normal; color: #0077FF; }
  .work { align-self: end; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .work figure { position: relative; aspect-ratio: 2961 / 2171; overflow: hidden; border-radius: 3px; }
  .work img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .work figure::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--c); }
</style>
</head>
<body>
  <p class="top"><b>{{role}} · {{studio}}</b><span>{{location}}</span></p>
  <p class="wm"><span>{{first}}</span><img src="../assets/mark/mark-static-512.png" alt=""><span>{{last}}</span></p>
  <p class="tag">{{!tagline}}</p>
  <div class="work">
{{!covers}}
  </div>
</body>
</html>
